<svg xmlns="http://www.w3.org/2000/svg" width="840" height="210" viewBox="0 0 840 210" role="img" aria-labelledby="title desc">
<title id="title">ChaseInTech — connect disciplines, build useful systems</title>
<desc id="desc">An animated orbital system around a geometric core, representing research, engineering and physical AI. Decorative motion respects reduced-motion preferences.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07101c"/><stop offset="1" stop-color="#112039"/></linearGradient>
  <linearGradient id="edge" x2="1" y2="1"><stop stop-color="#54e4cd"/><stop offset="1" stop-color="#258cff"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#258cff" stop-opacity=".25"/><stop offset="1" stop-color="#258cff" stop-opacity="0"/></radialGradient>
</defs>
<style>
  text { font-family:Arial,Helvetica,sans-serif; }
  .orbit { transform-origin:110px 105px; animation:orbit 24s linear infinite; }
  .signal { animation:signal 4s ease-in-out infinite; }
  @keyframes orbit { to { transform:rotate(360deg); } }
  @keyframes signal { 0%,100% { opacity:.35; } 50% { opacity:1; } }
  @media (prefers-reduced-motion:reduce) { .orbit,.signal { animation:none; } }
</style>
<rect x=".5" y=".5" width="839" height="209" rx="18" fill="url(#bg)" stroke="#28405a"/>
<circle cx="110" cy="105" r="100" fill="url(#glow)"/>
<g fill="none" stroke="#2d4863" opacity=".65">
  <ellipse cx="110" cy="105" rx="82" ry="54" transform="rotate(-28 110 105)"/>
  <ellipse cx="110" cy="105" rx="82" ry="54" transform="rotate(40 110 105)"/>
</g>
<g class="orbit" fill="none" stroke="url(#edge)" stroke-width="1.5">
  <circle cx="110" cy="105" r="75" stroke-dasharray="9 12" opacity=".55"/>
  <circle cx="185" cy="105" r="5" fill="#61e8d4" stroke="none"/>
  <circle cx="35" cy="105" r="3" fill="#318fff" stroke="none"/>
</g>
<g stroke="url(#edge)" stroke-width="1.5">
  <path d="M110 65 145 85 110 105 75 85Z" fill="#203953"/>
  <path d="M75 85 110 105 110 145 75 125Z" fill="#102a3c"/>
  <path d="M110 105 145 85 145 125 110 145Z" fill="#12354a"/>
</g>
<path class="signal" d="M190 105H225M222 101l4 4-4 4" fill="none" stroke="#60decf" stroke-width="1.5"/>
<text x="250" y="49" fill="#61e8d4" font-size="11" letter-spacing="3">CHASEINTECH / RESEARCH INTERESTS</text>
<text x="250" y="87" fill="#f1f6ff" font-size="25" font-weight="700">Connect disciplines.</text>
<text x="250" y="120" fill="#f1f6ff" font-size="25" font-weight="700">Build useful systems.</text>
<text x="250" y="154" fill="#a8bed5" font-size="13">Agent harnesses · Product abstractions · Robotics &amp; physical AI</text>
<path d="M250 176H790" stroke="#294157"/>
<text x="250" y="193" fill="#7391b0" font-size="10" letter-spacing="1.5">EXPLORE → BUILD → TEST → DISCOVER</text>
</svg>
